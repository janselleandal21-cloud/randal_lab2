name: Local Server CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Verify Environment
      run: |
        echo "Running on server workspace:"
        pwd
        whoami

    - name: Deploy PHP Project to Web Directory
      run: |
        echo "Syncing all project files and folders to web root..."
        mkdir -p /var/www/html/randal/randal_lab2
        
        # Sync project files without using sudo
        rsync -av --exclude='.git' --exclude='.github' ./ /var/www/html/randal/randal_lab2/
        
        # Adjust permissions safely
        chown -R randal:www-data /var/www/html/randal/randal_lab2/
        find /var/www/html/randal/randal_lab2/ -type d -exec chmod 755 {} \;
        find /var/www/html/randal/randal_lab2/ -type f -exec chmod 644 {} \;

    - name: Verify Deployment
      run: |
        echo "Deployment complete!"
        ls -la /var/www/html/randal/randal_lab2/