name: Local Server CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Verify Environment
      run: |
        echo "Running on server workspace:"
        pwd
        whoami

    - name: Deploy Project Files to Web Directory
      run: |
        echo "Copying all project folders and files to web root..."
        sudo mkdir -p /var/www/html/randal/randal_lab2
        # Kopyahin ang lahat maliban sa .git at .github folders para malinis ang deployment
        sudo rsync -av --exclude='.git' --exclude='.github' ./ /var/www/html/randal/randal_lab2/
        
        # Ayusin ang ownership at permissions para sa Apache at user randal
        sudo chown -R randal:www-data /var/www/html/randal/randal_lab2/
        sudo find /var/www/html/randal/randal_lab2/ -type d -exec chmod 755 {} \;
        sudo find /var/www/html/randal/randal_lab2/ -type f -exec chmod 644 {} \;

    - name: Verify Deployment
      run: |
        echo "Deployment complete! Listing web directory structure:"
        ls -la /var/www/html/randal/randal_lab2/