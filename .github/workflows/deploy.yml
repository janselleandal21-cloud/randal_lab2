name: Local Server CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Verify Environment
      run: |
        echo "Running on server workspace:"
        pwd
        whoami

    - name: Deploy PHP Project to Web Directory
      run: |
        echo "Syncing all project files and folders to web root..."
        sudo mkdir -p /var/www/html/randal/randal_lab2
        
        # I-sync ang buong proyekto maliban sa .git at .github folders
        sudo rsync -av --exclude='.git' --exclude='.github' ./ /var/www/html/randal/randal_lab2/
        
        # Itama ang ownership at permissions para sa Apache at user randal
        sudo chown -R randal:www-data /var/www/html/randal/randal_lab2/
        sudo find /var/www/html/randal/randal_lab2/ -type d -exec chmod 755 {} \;
        sudo find /var/www/html/randal/randal_lab2/ -type f -exec chmod 644 {} \;

    - name: Verify Deployment
      run: |
        echo "Deployment complete! Checking files in web root:"
        ls -la /var/www/html/randal/randal_lab2/