name: Local Server CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Verify Environment
      run: |
        echo "Running on server workspace:"
        pwd
        whoami

    - name: Deploy to Web Directory
      run: |
        echo "Deploying files to randal_lab2..."
        sudo mkdir -p /var/www/html/randal/randal_lab2
        # Kopyahin ang lahat ng laman patungo sa tamang subfolder
        sudo cp -r . /var/www/html/randal/randal_lab2/
        # Ayusin ang permissions para mabasa ng Apache
        sudo chown -R randal:www-data /var/www/html/randal/randal_lab2/
        sudo chmod -R 755 /var/www/html/randal/randal_lab2/

    - name: Verify Deployment
      run: |
        echo "Deployment complete!"
        ls -la /var/www/html/randal/randal_lab2/