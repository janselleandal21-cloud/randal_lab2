name: Local Server Docker CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          echo "Running on server workspace:"
          pwd
          whoami

      - name: Build and Restart Docker Container
        run: |
          echo "Building new Docker image for randal..."
          docker build -t randal-php-app .
          
          echo "Stopping and removing old container if it exists..."
          docker stop randal-app-container || true
          docker rm randal-app-container || true
          
          echo "Starting fresh container mapped to port 8080..."
          docker run -d --name randal-app-container -p 8080:80 randal-php-app

      - name: Verify Deployment
        run: |
          echo "Docker container deployment complete!"
          docker ps | grep randal-app-container